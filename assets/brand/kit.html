<!doctype html>
<!-- Source for the social kit PNGs. Render with headless Chrome: kit.html?k=avatar|header|og|tiktok at the matching window size. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>EndlessDevs social kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400&family=Big+Shoulders+Display:wght@900&display=swap">
<style>
html,body{margin:0;height:100%;background:#f2efe7;overflow:hidden}
.k{display:none;height:100%;flex-direction:column}
.k.on{display:flex}
.k svg{flex:1;width:100%;min-height:0;display:block}
.wm{font:900 132px/1 "Big Shoulders Display";fill:#141412;letter-spacing:4px}
.sub{font:400 30px/1 Barlow;fill:#141412;letter-spacing:22px}
.stripe{flex:none;height:var(--h,40px);background:repeating-linear-gradient(-55deg,#004d3a 0 calc(var(--h,40px)*.93),#f2efe7 calc(var(--h,40px)*.93) calc(var(--h,40px)*1.86));border-top:calc(var(--h,40px)/9) solid #141412}
.top{border-top:0;border-bottom:calc(var(--h,40px)/9) solid #141412}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.handle{font:400 44px/1 Barlow;letter-spacing:14px;color:#141412}
</style>
</head>
<body>
<template id="corridor">
<svg viewBox="0 0 1232 706" preserveAspectRatio="xMidYMid slice">
  <g fill="none" stroke="#141412" stroke-width="3">
    <path d="M0 0L333 191M1232 0L899 191M0 706L333 515M1232 706L899 515"/>
    <rect x="62" y="35" width="1108" height="636"/>
    <rect x="172" y="99" width="888" height="508"/>
    <rect x="259" y="148" width="714" height="410"/>
    <path d="M450 66H782M486 122H746" stroke-width="2"/>
  </g>
  <rect x="333" y="191" width="566" height="324" fill="#f8f6f0" stroke="#141412" stroke-width="4"/>
  <rect x="345" y="203" width="542" height="300" fill="none" stroke="#141412" stroke-width="1.5"/>
  <image href="mark.svg" x="506" y="218" width="220" height="110"/>
  <text class="wm" x="616" y="446" text-anchor="middle">ENDLESS</text>
  <text class="sub" x="627" y="487" text-anchor="middle">DEVS</text>
</svg>
</template>

<div class="k" id="avatar"><div class="center"><img src="mark.svg" style="width:78%"></div></div>
<div class="k corridor" id="header" style="--h:44px"></div>
<div class="k corridor" id="og" style="--h:36px"></div>
<div class="k" id="tiktok" style="--h:72px">
  <div class="stripe top"></div>
  <div class="center">
    <img src="mark.svg" style="width:62%">
    <svg viewBox="0 0 660 190" style="flex:none;width:92%"><text class="wm" x="330" y="132" text-anchor="middle" style="font-size:180px">ENDLESS</text><text class="sub" x="345" y="184" text-anchor="middle" style="font-size:40px;letter-spacing:30px">DEVS</text></svg>
    <div class="handle">@ENDLESS.DEVS</div>
  </div>
  <div class="stripe"></div>
</div>
<script>
const t = document.getElementById("corridor");
for (const el of document.querySelectorAll(".corridor")) { el.append(t.content.cloneNode(true)); el.insertAdjacentHTML("beforeend", '<div class="stripe"></div>'); }
document.getElementById(new URLSearchParams(location.search).get("k") || "og").classList.add("on");
</script>
</body>
</html>
