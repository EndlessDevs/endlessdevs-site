<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="EndlessDevs, independent developer of Germline.">
<title>EndlessDevs</title>
<style>
:root{color-scheme:dark;--bg:#0c1417;--ink:#e8efeb;--muted:#a7b8b4;--line:#293a3e;--accent:#c8ef9e}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 system-ui,sans-serif}
a{color:var(--accent);text-underline-offset:4px}a:hover{color:white}a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
header,footer{padding:28px 6vw;border-color:var(--line);border-style:solid;border-width:0 0 1px}
footer{border-width:1px 0 0;color:var(--muted);font-size:12px}
.brand{font-size:21px;letter-spacing:.17em;font-weight:650}
main{max-width:1200px;margin:auto;padding:65px 32px 80px}
.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.2em;font:12px monospace}
h1{font-size:clamp(42px,6vw,74px);line-height:1.1;font-weight:450;letter-spacing:-.045em;margin:20px 0}
p{max-width:610px;font-size:19px;color:var(--muted)}
@media(max-width:760px){header,footer{padding:22px}main{padding:42px 22px 50px}}
</style>
</head>
<body>
<header><div class="brand">ENDLESSDEVS</div></header>
<main>
<div class="eyebrow">Independent games</div>
<h1>Germline</h1>
<p>EndlessDevs is an independent developer. We make Germline.</p>
<p><a href="mailto:support@endlessdevs.co.uk">support@endlessdevs.co.uk</a> · <a href="/privacy">Privacy Policy</a></p>
</main>
<footer>© 2026 EndlessDevs</footer>
</body>
</html>
